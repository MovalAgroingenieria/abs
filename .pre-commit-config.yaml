repos:
  - repo: https://github.com/pycqa/pylint
    rev: v3.3.1
    hooks:
      - id: pylint
        language_version: python3.11
        additional_dependencies:
          - "pylint-odoo==9.3.22"


  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.1.7
    hooks:
      - id: oca-checks-odoo-module
      - id: oca-checks-po
        args: [ "--fix" ]

  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort
        args: [ "--profile=black" ]

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8

  - repo: local
    hooks:
      - id: pylint
        name: pylint (with pylint-odoo)
        entry: pylint
        language: system
        types: [ python ]
